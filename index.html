<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>I Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        #centerText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: clamp(20px, 5vw, 50px);
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-shadow: 
                0 0 20px rgba(255, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.5),
                0 0 80px rgba(255, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInPulse 3s ease-in forwards;
            pointer-events: none;
            letter-spacing: 6px;
            white-space: nowrap;
            z-index: 10;
        }
        @keyframes fadeInPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            30% { opacity: 0; }
            60% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            80% { transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        #centerText.pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1); 
                text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.5), 0 0 80px rgba(255,0,0,0.3); 
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.04); 
                text-shadow: 0 0 30px rgba(255,0,0,1), 0 0 60px rgba(255,0,0,0.7), 0 0 100px rgba(255,0,0,0.4); 
            }
        }
        @media (max-width: 768px) {
            #centerText {
                letter-spacing: 3px;
                font-size: clamp(18px, 5.5vw, 35px);
            }
        }
        @media (max-width: 480px) {
            #centerText {
                font-size: clamp(16px, 6vw, 28px);
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <div id="centerText">I Love You</div>

    <script>
        const isMobile = window.innerWidth < 768;
        
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        let WIDTH, HEIGHT, SCALE;
        let particles = [];
        let frame = 0;
        let startTime;
        let animationId = null;
        let isRunning = true;
        
        // ===== ТОЛЬКО ОДНА ФРАЗА =====
        const WORD = 'I Love You';
        
        const COLORS = [
            '#ff0000', '#ff1414', '#ff2828', '#cc0000', '#aa0000',
            '#ff3333', '#dc143c', '#ff0a0a', '#e60000', '#ff4040',
            '#ff5555', '#ff6666', '#006400', '#004400', '#008000'
        ];
        
        // ===== СЕРДЦЕ =====
        function heartXY(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return {x: x, y: -y};
        }
        
        function resize() {
            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            SCALE = Math.min(WIDTH, HEIGHT) / 45;
        }
        
        function createHeartParticles() {
            const newParticles = [];
            
            const scale = SCALE;
            const cx = WIDTH / 2;
            const cy = HEIGHT / 2;
            
            const totalParticles = isMobile ? 200 : 450;
            
            for (let i = 0; i < totalParticles; i++) {
                let x, y;
                let isOutline = false;
                
                if (i < totalParticles * 0.2) {
                    const t = (i / (totalParticles * 0.2)) * 2 * Math.PI;
                    const pos = heartXY(t);
                    x = pos.x * scale + cx;
                    y = pos.y * scale + cy;
                    isOutline = true;
                } else {
                    let attempts = 0;
                    let found = false;
                    while (!found && attempts < 15) {
                        attempts++;
                        const t = Math.random() * 2 * Math.PI;
                        const r = Math.random() * 0.9;
                        const pos = heartXY(t);
                        const px = pos.x * r;
                        const py = pos.y * r;
                        x = px * scale + cx;
                        y = py * scale + cy;
                        
                        const dist = Math.sqrt((x - cx)*(x - cx) + (y - cy)*(y - cy));
                        const maxDist = 16 * scale;
                        if (dist < maxDist) {
                            found = true;
                        }
                    }
                    if (!found) continue;
                }
                
                if (x > 0 && x < WIDTH && y > 0 && y < HEIGHT) {
                    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                    
                    newParticles.push({
                        x: x,
                        y: y,
                        word: WORD,
                        color: color,
                        alpha: 0,
                        flicker: Math.random() * Math.PI * 2,
                        delay: Math.random() * 80,
                        fontSize: isMobile ? 
                            (isOutline ? 8 + Math.random() * 2 : 6 + Math.random() * 2) : 
                            (isOutline ? 10 + Math.random() * 3 : 7 + Math.random() * 3),
                        isOutline: isOutline
                    });
                }
            }
            
            return newParticles;
        }
        
        function draw() {
            if (!isRunning) return;
            
            const now = Date.now();
            const elapsed = (now - startTime) / 16.67;
            frame = Math.floor(elapsed);
            
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            
            for (const p of particles) {
                if (frame > p.delay && p.alpha < 255) {
                    p.alpha = Math.min(255, p.alpha + 15);
                }
                
                let flick = 1.0;
                if (p.alpha >= 255) {
                    flick = 0.85 + 0.15 * Math.sin(frame * 0.04 + p.flicker);
                }
                
                const alpha = Math.floor(p.alpha * flick);
                if (alpha <= 5) continue;
                
                const fontSize = p.fontSize;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.shadowBlur = 0;
                ctx.globalAlpha = alpha / 255;
                ctx.fillStyle = p.color;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillText(p.word, p.x, p.y);
            }
            
            ctx.globalAlpha = 1;
            
            animationId = requestAnimationFrame(draw);
        }
        
        function startAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            resize();
            particles = createHeartParticles();
            frame = 0;
            startTime = Date.now();
            isRunning = true;
            
            draw();
        }
        
        // Центральный текст
        const centerTextEl = document.getElementById('centerText');
        setTimeout(() => {
            centerTextEl.classList.add('pulse');
        }, 3000);
        
        function exitApp() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.body.innerHTML = `
                <h1 style="color:#ff0000;text-align:center;margin-top:40vh;font-family:Georgia,serif;font-size:clamp(24px,6vw,48px);">
                    Thank You
                </h1>
            `;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') exitApp();
        });
        
        window.addEventListener('resize', () => {
            resize();
            particles = createHeartParticles();
        });
        
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                resize();
                particles = createHeartParticles();
            }, 300);
        });
        
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Запускаем!
        startAnimation();
        
        console.log('❤️ I Love You - финальная версия!');
    </script>
</body>
</html>
