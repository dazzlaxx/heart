<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>I Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        #centerText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: clamp(20px, 5vw, 50px);
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-shadow: 
                0 0 20px rgba(255, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.5),
                0 0 80px rgba(255, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInPulse 3s ease-in forwards;
            pointer-events: none;
            letter-spacing: 6px;
            white-space: nowrap;
            z-index: 10;
        }
        @keyframes fadeInPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            30% { opacity: 0; }
            60% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            80% { transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        #centerText.pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1); 
                text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.5), 0 0 80px rgba(255,0,0,0.3); 
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.04); 
                text-shadow: 0 0 30px rgba(255,0,0,1), 0 0 60px rgba(255,0,0,0.7), 0 0 100px rgba(255,0,0,0.4); 
            }
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.15);
            font-size: 11px;
            font-family: Arial, sans-serif;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 768px) {
            .info {
                font-size: 9px;
                bottom: 12px;
            }
            #centerText {
                letter-spacing: 3px;
                font-size: clamp(18px, 5.5vw, 35px);
            }
        }
        @media (max-width: 480px) {
            #centerText {
                font-size: clamp(16px, 6vw, 28px);
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <div id="centerText">Love You</div>
    <div class="info">tap for exit</div>

    <script>
        // Простая проверка, что мы на мобильном устройстве
        const isMobile = window.innerWidth < 768;
        
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        let WIDTH, HEIGHT, SCALE;
        let particles = [];
        let frame = 0;
        let startTime;
        let animationId = null;
        let isRunning = true;
        
        // Функция сердца - проверенная формула
        function heartXY(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return {x: x, y: -y};
        }
        
        function resize() {
            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            
            // Масштаб для сердца
            const baseScale = Math.min(WIDTH, HEIGHT) / 55;
            SCALE = isMobile ? Math.min(WIDTH, HEIGHT) / 45 : baseScale;
            
            console.log('Размер:', WIDTH, 'x', HEIGHT, 'Масштаб:', SCALE);
        }
        
        // Создаём частицы сердца
        function createHeartParticles() {
            const newParticles = [];
            
            // Количество частиц (меньше для телефона)
            const count = isMobile ? 150 : 250;
            
            // Цвета
            const colors = [
                '#ff0000', '#ff1414', '#ff2828', '#cc0000', '#aa0000',
                '#ff3333', '#dc143c', '#ff0a0a', '#e60000', '#ff4040',
                '#006400', '#004400'
            ];
            
            // Создаём частицы на контуре сердца
            for (let i = 0; i < count; i++) {
                const t = (i / count) * 2 * Math.PI;
                const pos = heartXY(t);
                
                // Для заполнения добавляем случайный радиус
                const r = 0.2 + Math.random() * 0.8;
                const px = pos.x * r;
                const py = pos.y * r;
                
                const sx = px * SCALE + WIDTH / 2;
                const sy = py * SCALE + HEIGHT / 2;
                
                // Проверяем, что точка в пределах экрана
                if (sx > 0 && sx < WIDTH && sy > 0 && sy < HEIGHT) {
                    newParticles.push({
                        x: sx,
                        y: sy,
                        word: 'Love You',
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 0,
                        flicker: Math.random() * Math.PI * 2,
                        delay: Math.floor(Math.random() * 100),
                        fontSize: isMobile ? 8 + Math.random() * 4 : 10 + Math.random() * 6,
                        sizeMult: 0.85 + Math.random() * 0.3
                    });
                }
            }
            
            console.log('Создано частиц:', newParticles.length);
            return newParticles;
        }
        
        function draw() {
            if (!isRunning) return;
            
            const now = Date.now();
            const elapsed = (now - startTime) / 16.67;
            frame = Math.floor(elapsed);
            
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            
            // Рисуем все частицы
            for (const p of particles) {
                // Появление с задержкой
                if (frame > p.delay && p.alpha < 255) {
                    p.alpha = Math.min(255, p.alpha + 10 + Math.floor(Math.random() * 4));
                }
                
                // Мерцание
                let flick = 1.0;
                if (p.alpha >= 255) {
                    flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
                }
                
                const alpha = Math.floor(p.alpha * flick);
                if (alpha <= 0) continue;
                
                const fontSize = p.fontSize * p.sizeMult;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Свечение (только для десктопа, для телефона упрощаем)
                if (alpha > 10 && !isMobile) {
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = fontSize * 2;
                    ctx.globalAlpha = alpha / 510;
                    ctx.fillStyle = p.color;
                    ctx.font = `bold ${fontSize * 2}px Arial`;
                    ctx.fillText(p.word, p.x, p.y);
                }
                
                // Основной текст
                ctx.shadowBlur = 0;
                ctx.globalAlpha = alpha / 255;
                ctx.fillStyle = p.color;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillText(p.word, p.x, p.y);
            }
            
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            
            animationId = requestAnimationFrame(draw);
        }
        
        // Запуск анимации
        function startAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            resize();
            particles = createHeartParticles();
            frame = 0;
            startTime = Date.now();
            isRunning = true;
            
            console.log('Запуск анимации, частиц:', particles.length);
            draw();
        }
        
        // Центральный текст
        const centerTextEl = document.getElementById('centerText');
        setTimeout(() => {
            centerTextEl.classList.add('pulse');
        }, 3000);
        
        // Выход
        function exitApp() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.body.innerHTML = `
                <h1 style="color:#ff0000;text-align:center;margin-top:40vh;font-family:Georgia,serif;font-size:clamp(24px,6vw,48px);">
                    Thank You
                </h1>
                <p style="color:rgba(255,255,255,0.3);text-align:center;font-family:Arial,sans-serif;margin-top:20px;font-size:14px;">
                    Love You
                </p>
            `;
        }
        
        // Обработчики событий
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                exitApp();
            }
        });
        
        document.addEventListener('click', exitApp);
        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            exitApp();
        });
        
        window.addEventListener('resize', () => {
            resize();
            particles = createHeartParticles();
        });
        
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                resize();
                particles = createHeartParticles();
            }, 300);
        });
        
        // Предотвращаем скролл
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Запускаем!
        console.log('❤️ Запуск Love You анимации');
        startAnimation();
    </script>
</body>
</html>
