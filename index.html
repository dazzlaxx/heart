<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>I Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        #centerText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: clamp(20px, 5vw, 50px);
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-shadow: 
                0 0 20px rgba(255, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.5),
                0 0 80px rgba(255, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInPulse 3s ease-in forwards;
            pointer-events: none;
            letter-spacing: 6px;
            white-space: nowrap;
            z-index: 10;
        }
        @keyframes fadeInPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            30% { opacity: 0; }
            60% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            80% { transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        #centerText.pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1); 
                text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.5), 0 0 80px rgba(255,0,0,0.3); 
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.04); 
                text-shadow: 0 0 30px rgba(255,0,0,1), 0 0 60px rgba(255,0,0,0.7), 0 0 100px rgba(255,0,0,0.4); 
            }
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.15);
            font-size: 11px;
            font-family: Arial, sans-serif;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
        #musicStatus {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            font-family: Arial, sans-serif;
            pointer-events: none;
            letter-spacing: 1px;
        }
        @media (max-width: 768px) {
            .info {
                font-size: 9px;
                bottom: 12px;
            }
            #centerText {
                letter-spacing: 3px;
                font-size: clamp(18px, 5.5vw, 35px);
            }
            #musicStatus {
                font-size: 10px;
                top: 12px;
                right: 12px;
            }
        }
        @media (max-width: 480px) {
            #centerText {
                font-size: clamp(16px, 6vw, 28px);
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <div id="centerText">Love You</div>
    <div id="musicStatus">🎵</div>
    <div class="info">❤️</div>

    <script>
        const isMobile = window.innerWidth < 768;
        
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        let WIDTH, HEIGHT, SCALE;
        let particles = [];
        let frame = 0;
        let startTime;
        let animationId = null;
        let isRunning = true;
        
        // ===== МУЗЫКА =====
        const musicStatus = document.getElementById('musicStatus');
        let audio = null;
        let isMusicPlaying = false;
        let musicStarted = false;
        
        function initAudio() {
            // Пробуем загрузить MP3
            const audioFiles = ['love_you.mp3', 'music.mp3', 'song.mp3'];
            let found = false;
            
            for (const file of audioFiles) {
                fetch(file, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok && !found) {
                            found = true;
                            audio = new Audio(file);
                            audio.loop = true;
                            audio.volume = 0.7;
                            console.log('✅ Музыка загружена:', file);
                            startMusic();
                        }
                    })
                    .catch(() => {});
            }
            
            // Если не нашли файлы, создаём синтезированную мелодию
            setTimeout(() => {
                if (!audio) {
                    console.log('🎵 MP3 файл не найден, создаём синтезированную музыку');
                    createSynthesizedMusic();
                }
            }, 1500);
        }
        
        function createSynthesizedMusic() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                
                const notes = [
                    523, 587, 659, 784, 880, 988, 1047,
                    523, 523, 587, 587, 659, 659, 784, 784,
                    880, 880, 988, 988, 1047, 1047, 1175, 1175
                ];
                
                let currentNote = 0;
                let intervalId = null;
                
                function playNote() {
                    if (!isMusicPlaying || !audioCtx) return;
                    
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.type = 'sine';
                        osc.frequency.value = notes[currentNote % notes.length];
                        
                        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                        
                        osc.start(audioCtx.currentTime);
                        osc.stop(audioCtx.currentTime + 0.25);
                        
                        currentNote++;
                    } catch(e) {}
                }
                
                audio = {
                    play: function() {
                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume();
                        }
                        isMusicPlaying = true;
                        musicStatus.textContent = '🎵';
                        if (intervalId) clearInterval(intervalId);
                        intervalId = setInterval(playNote, 300);
                        playNote();
                    },
                    pause: function() {
                        isMusicPlaying = false;
                        if (intervalId) {
                            clearInterval(intervalId);
                            intervalId = null;
                        }
                        musicStatus.textContent = '🎵';
                    },
                    loop: true,
                    volume: 0.7
                };
                
                startMusic();
                console.log('🎵 Создана синтезированная музыка');
            } catch (e) {
                console.log('❌ Не удалось создать музыку:', e);
            }
        }
        
        function startMusic() {
            if (!audio || musicStarted) return;
            
            try {
                // Пробуем запустить
                const playPromise = audio.play();
                if (playPromise) {
                    playPromise.then(() => {
                        isMusicPlaying = true;
                        musicStarted = true;
                        musicStatus.textContent = '🎵';
                        console.log('🎵 Музыка играет');
                    }).catch(() => {
                        // Браузер блокирует автозапуск, ждём взаимодействия
                        musicStatus.textContent = '🎵';
                        console.log('⏳ Ожидание взаимодействия для запуска музыки');
                        
                        // Запускаем при первом взаимодействии
                        const startOnInteraction = function() {
                            if (!musicStarted && audio) {
                                try {
                                    audio.play().then(() => {
                                        isMusicPlaying = true;
                                        musicStarted = true;
                                        musicStatus.textContent = '🎵';
                                        console.log('🎵 Музыка запущена');
                                    }).catch(() => {});
                                } catch(e) {}
                            }
                            document.removeEventListener('click', startOnInteraction);
                            document.removeEventListener('touchstart', startOnInteraction);
                        };
                        document.addEventListener('click', startOnInteraction);
                        document.addEventListener('touchstart', startOnInteraction);
                    });
                }
            } catch (e) {
                console.log('Ошибка запуска музыки:', e);
            }
        }
        
        // ===== АНИМАЦИЯ =====
        function heartXY(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return {x: x, y: -y};
        }
        
        function resize() {
            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            
            const baseScale = Math.min(WIDTH, HEIGHT) / 55;
            SCALE = isMobile ? Math.min(WIDTH, HEIGHT) / 42 : baseScale;
        }
        
        function createHeartParticles() {
            const newParticles = [];
            
            const colors = [
                '#ff0000', '#ff1414', '#ff2828', '#cc0000', '#aa0000',
                '#ff3333', '#dc143c', '#ff0a0a', '#e60000', '#ff4040',
                '#006400', '#004400'
            ];
            
            const outlineCount = isMobile ? 120 : 200;
            const fillCount = isMobile ? 100 : 180;
            
            // Контур
            for (let i = 0; i < outlineCount; i++) {
                const t = (i / outlineCount) * 2 * Math.PI;
                const pos = heartXY(t);
                
                const sx = pos.x * SCALE + WIDTH / 2;
                const sy = pos.y * SCALE + HEIGHT / 2;
                
                if (sx > 0 && sx < WIDTH && sy > 0 && sy < HEIGHT) {
                    newParticles.push({
                        x: sx,
                        y: sy,
                        word: 'Love You',
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 0,
                        flicker: Math.random() * Math.PI * 2,
                        delay: Math.floor(Math.random() * 80),
                        fontSize: isMobile ? 9 + Math.random() * 3 : 11 + Math.random() * 5,
                        sizeMult: 0.85 + Math.random() * 0.3,
                        isOutline: true
                    });
                }
            }
            
            // Заполнение
            for (let i = 0; i < fillCount; i++) {
                const t = Math.random() * 2 * Math.PI;
                const r = 0.15 + Math.random() * 0.85;
                
                const pos = heartXY(t);
                const px = pos.x * r;
                const py = pos.y * r;
                
                const sx = px * SCALE + WIDTH / 2;
                const sy = py * SCALE + HEIGHT / 2;
                
                if (sx > 0 && sx < WIDTH && sy > 0 && sy < HEIGHT) {
                    newParticles.push({
                        x: sx,
                        y: sy,
                        word: 'Love You',
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 0,
                        flicker: Math.random() * Math.PI * 2,
                        delay: 80 + Math.floor(Math.random() * 120),
                        fontSize: isMobile ? 7 + Math.random() * 3 : 9 + Math.random() * 4,
                        sizeMult: 0.85 + Math.random() * 0.3,
                        isOutline: false
                    });
                }
            }
            
            return newParticles;
        }
        
        function draw() {
            if (!isRunning) return;
            
            const now = Date.now();
            const elapsed = (now - startTime) / 16.67;
            frame = Math.floor(elapsed);
            
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            
            const sortedParticles = [...particles].sort((a, b) => {
                if (a.isOutline && !b.isOutline) return -1;
                if (!a.isOutline && b.isOutline) return 1;
                return 0;
            });
            
            for (const p of sortedParticles) {
                if (frame > p.delay && p.alpha < 255) {
                    p.alpha = Math.min(255, p.alpha + 12 + Math.floor(Math.random() * 5));
                }
                
                let flick = 1.0;
                if (p.alpha >= 255) {
                    flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
                }
                
                const alpha = Math.floor(p.alpha * flick);
                if (alpha <= 0) continue;
                
                const fontSize = p.fontSize * p.sizeMult;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                if (alpha > 10 && p.isOutline && !isMobile) {
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = fontSize * 2.5;
                    ctx.globalAlpha = alpha / 510;
                    ctx.fillStyle = p.color;
                    ctx.font = `bold ${fontSize * 2.2}px Arial`;
                    ctx.fillText(p.word, p.x, p.y);
                }
                
                ctx.shadowBlur = 0;
                ctx.globalAlpha = alpha / 255;
                ctx.fillStyle = p.color;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillText(p.word, p.x, p.y);
            }
            
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            
            animationId = requestAnimationFrame(draw);
        }
        
        function startAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            resize();
            particles = createHeartParticles();
            frame = 0;
            startTime = Date.now();
            isRunning = true;
            
            draw();
        }
        
        // Центральный текст
        const centerTextEl = document.getElementById('centerText');
        setTimeout(() => {
            centerTextEl.classList.add('pulse');
        }, 3000);
        
        function exitApp() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (audio && isMusicPlaying) {
                try {
                    audio.pause();
                } catch(e) {}
            }
            document.body.innerHTML = `
                <h1 style="color:#ff0000;text-align:center;margin-top:40vh;font-family:Georgia,serif;font-size:clamp(24px,6vw,48px);">
                    Thank You
                </h1>
                <p style="color:rgba(255,255,255,0.3);text-align:center;font-family:Arial,sans-serif;margin-top:20px;font-size:14px;">
                    Love You
                </p>
            `;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                exitApp();
            }
        });
        
        // Убираем выход по нажатию!
        // document.addEventListener('click', exitApp); // УДАЛЕНО
        // document.addEventListener('touchend', exitApp); // УДАЛЕНО
        
        window.addEventListener('resize', () => {
            resize();
            particles = createHeartParticles();
        });
        
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                resize();
                particles = createHeartParticles();
            }, 300);
        });
        
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Запускаем!
        initAudio();
        startAnimation();
        
        console.log('❤️ Love You - анимация запущена! Музыка включится автоматически.');
    </script>
</body>
</html>
